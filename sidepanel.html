<html lang="en">
  <head>
    <title>HTSP</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="tab-manager/tab-manager.css">
    <link rel="stylesheet" href="read-receipt-blocker/read-receipt-blocker.css">
    <link rel="stylesheet" href="json-viewer/json-viewer.css">
    <link rel="stylesheet" href="ext-manager/ext-manager.css">
  </head>
  <body>
    <div id="header">
      <div class="tabs">
        <div class="tab active" data-target="tab-manager-container">Tab Manager</div>
        <div class="tab" data-target="chatgpt-frame">ChatGPT</div>
        <div class="tab" data-target="gemini-frame">Gemini</div>
        <div class="tab" data-target="json-viewer-container">JSON</div>
        <div class="tab" data-target="ext-manager-container">Extensions</div>
        <div class="tab" data-target="read-receipt-container">Options</div>
      </div>
      <div class="dropdown">
        <button id="dropdown-btn" class="dropdown-btn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M11 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M18 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" />
          </svg>
        </button>
        <div id="dropdown-content" class="dropdown-content">
          <!-- Dropdown items will be populated by JS -->
        </div>
      </div>
    </div>

    <div class="iframe-container">
      <div id="tab-manager-container" class="ai-frame">
        <div id="tab-manager-header"></div>
        <label for="search-box"></label>
        <input type="text" id="search-box" placeholder="Search tabs...">
        <div id="window-groups-container">
          <!-- Window groups will be rendered here by JS -->
        </div>
      </div>
      <iframe id="chatgpt-frame" class="ai-frame hidden" data-src="https://chatgpt.com/" allow="clipboard-write; microphone"></iframe>
      <iframe id="gemini-frame" class="ai-frame hidden" data-src="https://gemini.google.com/app" allow="clipboard-write; microphone"></iframe>
      <div id="json-viewer-container" class="ai-frame hidden">
        <div id="jv-header">
          <div id="jv-search-wrap">
            <svg class="jv-search-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M21 21l-6 -6" /></svg>
            <input type="text" id="jv-search" placeholder="Search keys or values...">
            <span id="jv-search-count"></span>
          </div>
        </div>
        <div id="jv-output-area"></div>
        <div id="jv-error-bar"></div>
        <div id="jv-input-area">
          <div id="jv-input-wrap">
            <textarea id="jv-input" rows="1" placeholder="Paste JSON here…"></textarea>
            <button id="jv-clear-btn" title="Clear">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                <path d="M18 6l-12 12" /><path d="M6 6l12 12" />
              </svg>
            </button>
          </div>
        </div>
      </div>
      <div id="read-receipt-container" class="ai-frame hidden"></div>
      <div id="ext-manager-container" class="ai-frame hidden"></div>
    </div>
    <script src="sidepanel.js"></script>
    <script src="tab-manager/tab-manager.js"></script>
    <script src="json-viewer/json-viewer.js"></script>
    <script src="ext-manager/ext-manager.js"></script>
    <script src="read-receipt-blocker/read-receipt-blocker.js"></script>
    <script src="init.js"></script>
  </body>
</html>
